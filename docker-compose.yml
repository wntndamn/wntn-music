services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wntn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wntn}
      POSTGRES_DB: wntn
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wntn -d wntn"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wntn:${POSTGRES_PASSWORD:-wntn}@db:5432/wntn
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?set a long random secret in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      # S3-compatible object storage (R2 in prod). With S3_PUBLIC_BASE_URL set
      # the browser fetches objects straight from that domain; without it the
      # api presigns against S3_PUBLIC_ENDPOINT.
      S3_ENDPOINT: ${S3_ENDPOINT:?set the S3/R2 endpoint in .env}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      # set to an R2 public/custom domain to serve objects straight off the CDN
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-wntn-music}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      PORT: 3000
    # ./public mounted so `compose run api pnpm seed` can read the existing mp3s
    volumes:
      - ./public:/app/public:ro
    # Caddy is the prod entry (proxies /api). Port published for local dev/smoke tests.
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  redis-data:
  caddy-data:
  caddy-config:
